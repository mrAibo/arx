name: Provider capability migration

on:
  push:
    branches: [feat/vfs-provider-capabilities]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vfs-provider-capabilities
      - name: Apply migration
        run: |
          python scripts/apply_provider_capabilities.py
          if ! git diff --quiet -- src/vfs/mod.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/vfs/mod.rs
            git commit -m 'feat(vfs): register provider capabilities'
            git push origin HEAD:feat/vfs-provider-capabilities
          fi
