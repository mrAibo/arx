name: TEMP WebDAV Move Rustfmt Artifact

on:
  push:
    branches:
      - feature/webdav-verified-move
    paths:
      - '.github/workflows/tmp-webdav-move-rustfmt.yml'
      - 'src/transfer/executor.rs'
      - 'src/transfer/mod.rs'
      - 'src/transfer/webdav_move.rs'

permissions:
  contents: read

jobs:
  rustfmt-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: webdav-move-rustfmt-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            src/transfer/executor.rs
            src/transfer/mod.rs
            src/transfer/webdav_move.rs
