name: TEMP WebDAV Move Rustfmt Commit

on:
  push:
    branches:
      - feature/webdav-verified-move
    paths:
      - '.github/workflows/tmp-webdav-move-rustfmt.yml'

permissions:
  contents: write

jobs:
  rustfmt-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format expected Rust files only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          unexpected="$(git diff --name-only | grep -vE '^(src/transfer/executor\.rs|src/transfer/mod\.rs|src/transfer/webdav_move\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "rustfmt changed unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transfer/executor.rs src/transfer/mod.rs src/transfer/webdav_move.rs
          git rm .github/workflows/tmp-webdav-move-rustfmt.yml
          git commit -m 'test: format WebDAV move transaction'
          git push origin HEAD:refs/heads/feature/webdav-verified-move
