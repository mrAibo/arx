name: Validate WebDAV copy acceptance polish

on:
  push:
    branches:
      - feature/webdav-webdav-recursive-copy
    paths:
      - '.github/workflows/fix-webdav-copy-acceptance-polish.yml'
      - 'scripts/fix_webdav_copy_acceptance_polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply physical acceptance polish
        run: python3 scripts/fix_webdav_copy_acceptance_polish.py
      - name: Quality gate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked webdav_remote_copy_requires_frozen_copy_tree_and_rejects_move
          cargo test --locked webdav_to_webdav_freezes_exact_collection_and_new_destination
          cargo test --locked webdav_to_webdav_rejects_file_and_multi_root
      - name: Commit clean test-only polish
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-webdav-copy-acceptance-polish.yml scripts/fix_webdav_copy_acceptance_polish.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: polish WebDAV remote copy acceptance'
          git push origin HEAD:feature/webdav-webdav-recursive-copy
