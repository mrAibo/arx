name: Fix SFTP sync connection error typing

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/sftp-sftp-workspace-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Apply exact compile fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/transfer/sftp_copy.rs')
          text = p.read_text()
          old = '''        Err(error) => {\n            let _ = source.close().await;\n            return Err(error);\n        }\n'''
          new = '''        Err(error) => {\n            let _ = source.close().await;\n            return Err(TransferExecutionError::safe_to_retry(error));\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact connection-error anchor once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit source only and remove helper
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-sftp-sync-connect-error.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/transfer/sftp_copy.rs
          git commit -m "fix: classify SFTP destination connect failure"
          git push origin "HEAD:${HEAD_BRANCH}"
