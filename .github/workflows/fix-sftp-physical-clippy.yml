name: Fix SFTP physical Clippy

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply exact unused-variable correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sftp_workspace_sync_physical.rs')
          s = p.read_text()
          old = 'let (left, right, left_path, right_path) = cross_host_roots(fixture, "stale-source")?;'
          new = 'let (left, right, left_path, _right_path) = cross_host_roots(fixture, "stale-source")?;'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale-source anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --check
          git diff --check

      - name: Commit correction and remove helper
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/fix-sftp-physical-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sftp_workspace_sync_physical.rs .github/workflows/fix-sftp-physical-clippy.yml
          git commit -m "test: satisfy SFTP physical clippy contract"
          git push origin "HEAD:${HEAD_REF}"
