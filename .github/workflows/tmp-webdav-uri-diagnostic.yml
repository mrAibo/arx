name: TEMP WebDAV URI Diagnostic

on:
  push:
    branches: [feature/webdav-verified-move]
    paths:
      - ".github/workflows/tmp-webdav-uri-diagnostic.yml"

permissions:
  contents: read

jobs:
  apache-uri-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Provision Apache and inspect Unicode/space collection href
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/setup_webdav_copy_acceptance.sh
          NAME='arx-diag space unicodé'
          ENCODED="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("arx-diag space unicodé", safe=""))')"
          URL="${ARX_WEBDAV_COPY_B_HOST}${ENCODED}/"
          echo "REQUESTED_URL=${URL}"
          STATUS="$(curl -sS -o /tmp/mkcol.out -w '%{http_code}' \
            --user "${ARX_WEBDAV_COPY_B_USER}:${ARX_WEBDAV_COPY_B_PASS}" \
            -X MKCOL "${URL}")"
          echo "MKCOL_STATUS=${STATUS}"
          test "${STATUS}" = "201"
          PF_STATUS="$(curl -sS -o /tmp/propfind.xml -w '%{http_code}' \
            --user "${ARX_WEBDAV_COPY_B_USER}:${ARX_WEBDAV_COPY_B_PASS}" \
            -X PROPFIND -H 'Depth: 0' "${URL}")"
          echo "PROPFIND_STATUS=${PF_STATUS}"
          test "${PF_STATUS}" = "207"
          echo 'RAW_PROPFIND_BEGIN'
          cat /tmp/propfind.xml
          echo
          echo 'RAW_PROPFIND_END'
          python3 - <<'PY'
          import re
          body = open('/tmp/propfind.xml', 'r', encoding='utf-8', errors='replace').read()
          hrefs = re.findall(r'<[^>]*href[^>]*>(.*?)</[^>]*href>', body, flags=re.I|re.S)
          for i, href in enumerate(hrefs):
              print(f'HREF_{i}={href}')
          PY
