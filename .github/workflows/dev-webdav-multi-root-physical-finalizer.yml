name: DEV WebDAV multi-root physical finalizer

on:
  push:
    branches: [feature/webdav-multi-root-copy]
    paths:
      - '.github/workflows/dev-webdav-multi-root-physical-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Apply already-validated physical acceptance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dev_webdav_multi_root_physical_finalizer.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit only physical acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u src/vfs/webdav_acceptance.rs src/vfs/webdav_interop_acceptance.rs
          git commit -m 'test: cover WebDAV multi-root F5 physically'
          git push origin HEAD:feature/webdav-multi-root-copy
