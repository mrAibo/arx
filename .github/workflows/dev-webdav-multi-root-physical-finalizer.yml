name: DEV WebDAV multi-root physical finalizer

on:
  push:
    branches: [feature/webdav-multi-root-copy]
    paths:
      - '.github/workflows/dev-webdav-multi-root-physical-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Apply physical acceptance patch
        run: python3 tools/dev_webdav_multi_root_physical_finalizer.py
      - name: Standard acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --locked --all-features
          git diff --check
      - name: Commit acceptance and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dev-webdav-multi-root-physical-finalizer.yml
          git rm tools/dev_webdav_multi_root_physical_finalizer.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/webdav-interop.yml \
            src/vfs/webdav_acceptance.rs src/vfs/webdav_interop_acceptance.rs
          git commit -m 'test: cover WebDAV multi-root F5 physically'
          git push origin HEAD:feature/webdav-multi-root-copy
