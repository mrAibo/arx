name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quality gates: fmt, clippy, tests on the intentional quality toolchain.
  # Clippy is pinned so a new release cannot turn an unchanged commit red.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  # MSRV gate: proves the declared rust-version in Cargo.toml is truthful.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88
        # No rustfmt/clippy — MSRV check is compile-only.

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --locked --all-features

  # Physical WebDAV acceptance (W1–W18) against a real Apache mod_dav fixture.
  # Uses the existing test-only setup script; the chmod-0600 env file is
  # sourced and the physical test is run in the SAME shell step so the
  # credentials do not leak across steps. Fails (does not skip) if fixture
  # setup or env resolution fails.
  #
  # Exact-SHA gate: for pull_request runs we check out the PR HEAD (not the
  # GitHub merge ref) and assert git HEAD equals the expected PR head SHA, so
  # the reported evidence is the real PR commit, not a synthetic merge commit.
  webdav-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request: test the PR HEAD exactly (not the merge ref).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Exact-SHA evidence (PR head)
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$TESTED_SHA"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$TESTED_SHA" ]; then
            echo "::error::checked-out SHA ($TESTED_SHA) != PR head ($EXPECTED)"
            exit 1
          fi

      - name: Provision Apache mod_dav fixture + run physical W1–W18
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # GitHub runner already provides docker; do NOT reinstall (avoids
          # containerd.io conflict). Bring the service up if needed.
          sudo systemctl start docker || true
          docker info >/dev/null 2>&1 || { echo "docker unavailable"; exit 1; }
          source ./scripts/setup_webdav_acceptance.sh
          set +x
          source "$ENV_FILE"
          cargo test --locked --lib --features physical-webdav physical_w1_through_w18 -- --nocapture
          cargo test --locked --lib --features physical-webdav physical_webdav_recursive_download_tree -- --nocapture
          cargo test --locked --lib --features physical-webdav physical_webdav_recursive_upload_tree -- --nocapture
          cargo test --locked --lib --features physical-webdav physical_webdav_recursive_delete_tree -- --nocapture
          cargo test --locked --test webdav_recursive_delete_safety --features physical-webdav -- --nocapture --test-threads=1

  # #7: real PTY + real tmux/GNU screen interactive lifecycle acceptance.
  # Checks out the exact PR head, creates disposable sessions, drives normal
  # detach, and proves TuiTerminalSession reacquires raw/alternate/mouse.
  multiplexer-terminal-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Exact-SHA evidence (PR head)
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$TESTED_SHA"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$TESTED_SHA" ]; then
            echo "::error::checked-out SHA ($TESTED_SHA) != PR head ($EXPECTED)"
            exit 1
          fi

      - name: Install multiplexer fixtures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux screen

      - name: Real PTY multiplexer lifecycle
        env:
          ARX_MULTIPLEXER_PHYSICAL: "1"
        run: |
          set -euo pipefail
          cargo test --locked --test multiplexer_terminal_physical -- --nocapture --test-threads=1

  # Physical S3 safe-read retry (PACK G P8) against real MinIO.
  # Drives S3TransferSpec::DownloadOne through the REAL TransferQueueRuntime
  # with the S3 endpoint pointed at a one-shot TCP fault proxy: the first
  # GetObject body is truncated (real transport failure), the second is a
  # transparent pass-through. Proves the production seam
  # (body.read error -> remove_staged -> cleanup_then_safe -> SafeToRetry)
  # drives RetryWaiting then a successful second attempt under one JobId.
  # Fails (does not skip) if MinIO or the test setup cannot run.
  transfer-queue-s3-retry-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Exact-SHA evidence (PR head)
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$TESTED_SHA"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$TESTED_SHA" ]; then
            echo "::error::checked-out SHA ($TESTED_SHA) != PR head ($EXPECTED)"
            exit 1
          fi

      - name: Provision MinIO + run P8 safe-read retry physical
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo systemctl start docker || true
          docker info >/dev/null 2>&1 || { echo "docker unavailable"; exit 1; }
          docker run -d --name arx-minio-p8 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          for i in $(seq 1 30); do
            docker run --rm --network host \
              -e MC_HOST_p=http://minioadmin:minioadmin@127.0.0.1:9000 \
              minio/mc:latest ls p/ >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network host \
            -e MC_HOST_p=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc:latest mb p/arxtest
          export ARX_MINIO_TEST=1
          export AWS_ENDPOINT_URL=http://127.0.0.1:9000
          export AWS_ACCESS_KEY_ID=minioadmin
          export AWS_SECRET_ACCESS_KEY=minioadmin
          cargo test --locked --test transfer_queue_s3_retry_physical -- --nocapture