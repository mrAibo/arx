name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quality gates: fmt, clippy, tests on the intentional quality toolchain.
  # Clippy is pinned so a new release cannot turn an unchanged commit red.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  # MSRV gate: proves the declared rust-version in Cargo.toml is truthful.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88
        # No rustfmt/clippy — MSRV check is compile-only.

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --locked --all-features
