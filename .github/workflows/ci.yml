name: CI

on:
  push:
    branches: [main, feat/vfs-provider-capabilities]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Apply one-shot provider capability migration
        if: github.ref_name == 'feat/vfs-provider-capabilities' || github.head_ref == 'feat/vfs-provider-capabilities'
        run: |
          python scripts/apply_provider_capabilities.py
          if ! git diff --quiet -- src/vfs/mod.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/vfs/mod.rs
            git commit -m 'feat(vfs): register provider capabilities'
            git push origin HEAD:feat/vfs-provider-capabilities
          fi

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
