name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Windows needs Lua for mlua-sys + dbus for keyring
      - name: Install Windows deps
        if: matrix.os == 'windows-latest'
        run: |
          choco install lua54 -y
          echo "LUA_INC=C:\Lua54\include" >> $env:GITHUB_ENV
          echo "LUA_LIB=C:\Lua54" >> $env:GITHUB_ENV

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
