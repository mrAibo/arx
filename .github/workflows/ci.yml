name: CI

on:
  push:
    branches: [main, fix/ci-p0-hardening]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Apply one-shot borrow fix
        if: github.event_name == 'push' && github.ref_name == 'fix/ci-p0-hardening'
        run: |
          python scripts/apply_ci_borrow_fix.py
          if ! git diff --quiet -- src/tui.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/tui.rs
            git commit -m 'fix(tui): handle tree Backspace before pane borrow'
            git push origin HEAD:fix/ci-p0-hardening
          fi

      # Pin the quality toolchain so a new stable Clippy release cannot turn
      # an unchanged commit red overnight. Bump intentionally in a dedicated PR.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
