name: Apply SFTP-to-SFTP sync core patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/sftp-sftp-workspace-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Apply strict source transformations
        run: |
          set -euo pipefail
          python3 scripts/apply_sftp_sftp_sync_core.py
          cargo fmt --all
          git diff --check

      - name: Commit only the resulting feature diff
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm scripts/apply_sftp_sftp_sync_core.py .github/workflows/apply-sftp-sftp-sync-core.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workspace_sync_execution.rs src/workspace_sync_executor/compiler.rs src/workspace_sync_executor/runtime.rs src/transfer/mod.rs src/transfer/sftp_copy.rs
          git commit -m "feat: add SFTP-to-SFTP workspace sync core"
          git push origin "HEAD:${HEAD_BRANCH}"
