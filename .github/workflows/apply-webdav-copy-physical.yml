name: Apply WebDAV copy physical wiring

on:
  push:
    branches:
      - feature/webdav-webdav-recursive-copy
    paths:
      - '.github/workflows/apply-webdav-copy-physical.yml'
      - 'scripts/apply_webdav_copy_physical.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply frozen #275 physical wiring
        run: python3 scripts/apply_webdav_copy_physical.py

      - name: Compile all targets and focused tests
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --locked --all-targets --all-features
          cargo test --locked webdav_remote_copy_requires_frozen_copy_tree_and_rejects_move
          cargo test --locked webdav_to_webdav_freezes_exact_collection_and_new_destination
          cargo test --locked webdav_to_webdav_rejects_file_and_multi_root

      - name: Commit production and physical test patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-webdav-copy-physical.yml scripts/apply_webdav_copy_physical.py
          git add -A
          git diff --cached --check
          echo 'Changed files:'
          git diff --cached --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add WebDAV-to-WebDAV physical acceptance'
          git push origin HEAD:feature/webdav-webdav-recursive-copy
