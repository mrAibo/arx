name: Temporary Remote Workspace UX Migration

on:
  push:
    branches: [feature/remote-workspace-ux]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Migrate and validate
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'pub struct WorkspaceSyncJobContext' src/jobs/mod.rs; then
            python3 .github/ux_jobs_migrate.py
          fi
          if grep -q 'cancel_during_first_step_starts_verification_with_zero_completed_steps' tests/workspace_sync_verification.rs; then
            python3 .github/ux_test_hardening.py
          fi
          if ! grep -q 'ConfirmWorkspaceSync' src/app/actions.rs; then
            python3 .github/fix_ux_state_bootstrap.py
            python3 .github/fix_ux_state_clippy.py
            python3 .github/ux_state_migrate.py
          fi
          cargo fmt
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          git diff --check
          if git diff --quiet -- src tests; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'feat: model workspace sync UX state and actions'
          git push origin HEAD:feature/remote-workspace-ux
