name: Fix SFTP sync compiler contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/sftp-sftp-workspace-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Update stale compiler contracts exactly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/workspace_sync_compiler.rs')
          text = p.read_text()
          old1 = '''#[test]\nfn sftp_directory_creation_is_compile_time_gated() {\n    let diff = WorkspaceDiff::compare(\n        local("/left"),\n        sftp("prod", "/right"),\n        vec![dir("new-dir")],\n        Vec::<WorkspaceEntry>::new(),\n    );\n    let error = SyncExecutionCompiler::compile(\n        executable(&diff, SyncPolicy::default(), false),\n        &diff,\n        &default_registry(),\n        &remote_matrix("prod"),\n    )\n    .unwrap_err();\n\n    assert!(matches!(\n        error,\n        SyncCompileError::UnsupportedDirectoryMutation { ref path, .. } if path == "new-dir"\n    ));\n}\n'''
          new1 = '''#[test]\nfn sftp_directory_creation_compiles_through_provider_capability() {\n    let diff = WorkspaceDiff::compare(\n        local("/left"),\n        sftp("prod", "/right"),\n        vec![dir("new-dir")],\n        Vec::<WorkspaceEntry>::new(),\n    );\n    let compiled = SyncExecutionCompiler::compile(\n        executable(&diff, SyncPolicy::default(), false),\n        &diff,\n        &default_registry(),\n        &remote_matrix("prod"),\n    )\n    .unwrap();\n\n    assert_eq!(compiled.steps().len(), 1);\n    assert!(matches!(\n        &compiled.steps()[0].step,\n        PhysicalSyncStep::EnsureDirectory {\n            relative_path,\n            target: Location::Sftp { host, path },\n            expected_target: None,\n        } if relative_path == "new-dir" && host == "prod" && path == "/right/new-dir"\n    ));\n}\n'''
          old2 = '''#[test]\nfn compiler_failure_creates_no_journal_record() {\n    let journal_dir = tempfile::tempdir().unwrap();\n    let journal = OperationJournal::open(journal_dir.path().join("ops.jsonl")).unwrap();\n    let diff = WorkspaceDiff::compare(\n        local("/left"),\n        sftp("prod", "/right"),\n        vec![dir("new-dir")],\n        Vec::<WorkspaceEntry>::new(),\n    );\n\n    let result = SyncExecutionCompiler::compile(\n        executable(&diff, SyncPolicy::default(), false),\n        &diff,\n        &default_registry(),\n        &remote_matrix("prod"),\n    );\n\n    assert!(result.is_err());\n    assert!(journal.read_all().unwrap().is_empty());\n}\n'''
          new2 = '''#[test]\nfn compiler_failure_creates_no_journal_record() {\n    let journal_dir = tempfile::tempdir().unwrap();\n    let journal = OperationJournal::open(journal_dir.path().join("ops.jsonl")).unwrap();\n    let diff = WorkspaceDiff::compare(\n        local("/left"),\n        sftp("prod", "/right"),\n        vec![file("a.txt", 1)],\n        Vec::<WorkspaceEntry>::new(),\n    );\n\n    // A real compiler failure remains possible when the exact SFTP endpoint\n    // has no proven transfer executor. The compiler must still fail before any\n    // journal lifecycle exists.\n    let result = SyncExecutionCompiler::compile(\n        executable(&diff, SyncPolicy::default(), false),\n        &diff,\n        &default_registry(),\n        &SyncExecutorMatrix::local_only(),\n    );\n\n    assert!(matches!(\n        result,\n        Err(SyncCompileError::MissingExecutorAvailability { ref host }) if host == "prod"\n    ));\n    assert!(journal.read_all().unwrap().is_empty());\n}\n'''
          for label, old, new in [('sftp-dir', old1, new1), ('journal-failure', old2, new2)]:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exact anchor once, found {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          cargo test --test workspace_sync_compiler
      - name: Commit test update only and remove helper
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-sftp-sync-compiler-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workspace_sync_compiler.rs
          git commit -m "test: update SFTP workspace compiler contracts"
          git push origin "HEAD:${HEAD_BRANCH}"
