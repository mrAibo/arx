name: TEMP WebDAV URI Case Fix

on:
  push:
    branches: [feature/webdav-verified-move]
    paths:
      - ".github/workflows/tmp-webdav-uri-case-fix.yml"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/webdav-verified-move
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply URI equivalence fix and strengthen drift acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/vfs/webdav.rs')
          s = p.read_text()
          old = '''fn canonical_url_identity(url: &url::Url) -> String {
              let mut canonical = url.clone();
              canonical.set_fragment(None);
              // A collection trailing slash is presentation-equivalent for cycle/self
              // detection, while a legitimate query remains part of remote identity.
              let path = canonical.path().trim_end_matches('/').to_string();
              canonical.set_path(&path);
              canonical.to_string()
          }
          '''
          new = '''fn canonical_url_identity(url: &url::Url) -> String {
              let mut canonical = url.clone();
              canonical.set_fragment(None);
              // URI percent-escape hex digits are case-insensitive. Servers such as
              // Apache mod_dav may return `%c3%a9` for a request sent as `%C3%A9`.
              // Normalize ONLY valid escape hex case: never percent-decode path bytes,
              // never collapse separators, and keep the query as remote identity.
              let path = normalize_percent_escape_hex_case(canonical.path().trim_end_matches('/'));
              canonical.set_path(&path);
              canonical.to_string()
          }

          fn normalize_percent_escape_hex_case(path: &str) -> String {
              let mut bytes = path.as_bytes().to_vec();
              let mut index = 0usize;
              while index + 2 < bytes.len() {
                  if bytes[index] == b'%' && is_hex(bytes[index + 1]) && is_hex(bytes[index + 2]) {
                      bytes[index + 1].make_ascii_uppercase();
                      bytes[index + 2].make_ascii_uppercase();
                      index += 3;
                  } else {
                      index += 1;
                  }
              }
              String::from_utf8(bytes)
                  .expect("normalizing ASCII percent-escape digits preserves UTF-8")
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'canonical function match count={s.count(old)}')
          s = s.replace(old, new)
          anchor = '''    #[test]
              fn recursive_direct_child_shape_r7_r8() {
          '''
          test = '''    #[test]
              fn canonical_url_identity_normalizes_only_percent_escape_hex_case() {
                  let upper = url::Url::parse("http://example/dav/unicod%C3%A9/").unwrap();
                  let lower = url::Url::parse("http://example/dav/unicod%c3%a9/").unwrap();
                  assert_eq!(canonical_url_identity(&upper), canonical_url_identity(&lower));

                  let encoded_a = url::Url::parse("http://example/dav/%41").unwrap();
                  let literal_a = url::Url::parse("http://example/dav/A").unwrap();
                  assert_ne!(
                      canonical_url_identity(&encoded_a),
                      canonical_url_identity(&literal_a),
                      "canonical matching must not percent-decode path bytes"
                  );

                  let query_one = url::Url::parse("http://example/dav/a%20b?version=1").unwrap();
                  let query_two = url::Url::parse("http://example/dav/a%20b?version=2").unwrap();
                  assert_ne!(canonical_url_identity(&query_one), canonical_url_identity(&query_two));
              }

          '''
          if s.count(anchor) != 1:
              raise SystemExit(f'test anchor match count={s.count(anchor)}')
          p.write_text(s.replace(anchor, test + anchor))

          p = Path('tests/webdav_move_physical.rs')
          s = p.read_text()
          old = '''    assert_eq!(error.retry_disposition(), RetryDisposition::NeverRetry);
              assert!(error.to_string().contains("source changed"));
              assert!(file_exists(&f.a.provider, &format!("/{root}/late.txt")).await);
              assert!(!collection_exists(&f.b.provider, f.b.id, &format!("/{root}")).await);
          '''
          new = '''    assert_eq!(error.retry_disposition(), RetryDisposition::NeverRetry);
              assert!(
                  error.to_string().contains("source tree changed"),
                  "source drift must be reported factually: {error}"
              );
              assert!(
                  file_exists(&f.a.provider, &format!("/{root}/a.txt")).await,
                  "original source child must remain: source DELETE must not start"
              );
              assert!(file_exists(&f.a.provider, &format!("/{root}/late.txt")).await);
              assert!(!collection_exists(&f.b.provider, f.b.id, &format!("/{root}")).await);
          '''
          if s.count(old) != 1:
              raise SystemExit(f'source drift assertion match count={s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' src/vfs/webdav.rs tests/webdav_move_physical.rs | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Unit and compile proof
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --lib canonical_url_identity_normalizes_only_percent_escape_hex_case -- --nocapture
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --test webdav_move_physical --features physical-webdav --no-run

      - name: Apache physical Move proof
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/setup_webdav_copy_acceptance.sh
          cargo test --locked --test webdav_move_physical --features physical-webdav \
            physical_webdav_verified_move_transaction -- --nocapture --test-threads=1

      - name: Commit only fully proven changes and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-webdav-uri-case-fix.yml
          git diff --check
          CHANGED="$(git status --short | awk '{print $2}' | sort)"
          EXPECTED="$(printf '%s\n' src/vfs/webdav.rs tests/webdav_move_physical.rs .github/workflows/tmp-webdav-uri-case-fix.yml | sort)"
          test "$CHANGED" = "$EXPECTED"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vfs/webdav.rs tests/webdav_move_physical.rs .github/workflows/tmp-webdav-uri-case-fix.yml
          git commit -m "fix: canonicalize WebDAV percent-escape case"
          git push origin HEAD:feature/webdav-verified-move
