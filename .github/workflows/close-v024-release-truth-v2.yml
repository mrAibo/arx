name: Close v0.24.0 release truth v2

on:
  pull_request:
    paths:
      - '.github/workflows/close-v024-release-truth-v2.yml'
      - 'scripts/close_v024_release_truth_v2.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/close-v0.24.0-release-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch reviewed closure source
        run: git fetch --no-tags origin 4a4c96a29c3f9d5d76dd13876b5be740a39bb6c5

      - name: Apply corrected canonical v0.24.0 truth
        run: python3 scripts/close_v024_release_truth_v2.py

      - name: Validate docs-only closure
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '**Current release: [v0.24.0](https://github.com/mrAibo/arx/releases/tag/v0.24.0)**' README.md
          grep -Fq 'docs/releases/v0.24.0.md' README.md
          grep -Fq '**Current public release:** `v0.24.0`' ROADMAP.md
          grep -Fq 'WebDAV→WebDAV recursive/cross-target copy with exact source/target identity' ROADMAP.md
          grep -Fq 'Current public release: **v0.24.0**' docs/DEVELOPMENT_HANDOFF.md
          grep -Fq 'Current public release is v0.24.0' docs/DEVELOPMENT_HANDOFF.md
          grep -Fq '33012256020' docs/DEVELOPMENT_HANDOFF.md
          if git diff --name-only | grep -Ev '^(README.md|ROADMAP.md|docs/DEVELOPMENT_HANDOFF.md)$'; then
            echo 'FAIL: unexpected production file in release-truth diff' >&2
            exit 1
          fi

      - name: Commit docs and remove helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/close-v024-release-truth-v2.yml scripts/close_v024_release_truth_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'FAIL: no corrected docs closure changes'; exit 1; }
          git commit -m 'docs: close v0.24.0 release truth'
          git push origin HEAD:${{ github.head_ref }}
