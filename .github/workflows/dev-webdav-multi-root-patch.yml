name: DEV WebDAV multi-root finalizer

on:
  push:
    branches: [feature/webdav-multi-root-copy]
    paths:
      - '.github/workflows/dev-webdav-multi-root-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Apply exact reviewed patch and update obsolete characterization
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/multi-root.patch
          git apply --check /tmp/multi-root.patch
          git apply /tmp/multi-root.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/tui/transfers.rs')
          text = p.read_text()
          old = '''    #[test]\n    fn webdav_multi_selection_dispatch_fails_before_enqueue() {\n'''
          new = '''    #[tokio::test]\n    async fn webdav_multi_selection_dispatch_queues_one_job() {\n'''
          if text.count(old) != 1:
              raise SystemExit('obsolete multi-root test header mismatch')
          text = text.replace(old, new, 1)
          old = '''        assert_eq!(\n            state.message.as_deref(),\n            Some("WebDAV copy currently supports one selected item")\n        );\n        assert!(sync.jobs.snapshot().is_empty(), "nothing enqueued");\n'''
          new = '''        let message = state.message.as_deref().expect("queue confirmation");\n        assert!(message.starts_with("Copy queued ("), "unexpected message: {message}");\n        assert_eq!(sync.jobs.snapshot().len(), 1, "one batch selection = one job");\n'''
          if text.count(old) != 1:
              raise SystemExit('obsolete multi-root assertion mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Standard acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --locked --all-features
          git diff --check
      - name: Commit clean production implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dev-webdav-multi-root-patch.yml
          git rm .github/workflows/dev-webdav-multi-root-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transfer/mod.rs src/transfer/webdav_batch.rs src/transfer/executor.rs src/tui/transfers.rs
          git commit -m 'feat: wire WebDAV multi-root F5 copy'
          git push origin HEAD:feature/webdav-multi-root-copy
