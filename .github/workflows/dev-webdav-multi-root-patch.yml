name: DEV WebDAV multi-root finalizer

on:
  push:
    branches: [feature/webdav-multi-root-copy]
    paths:
      - '.github/workflows/dev-webdav-multi-root-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Apply reviewed core patch and corrective tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4355f24e8a74c3393c34bc3dbe05a8e5753457c0 HEAD

          # Reuse the reviewed deterministic patch script from this workflow's
          # immediate predecessor, then apply the two narrow corrections found
          # by the exact-head diagnostic run.
          git show HEAD^:.github/workflows/dev-webdav-multi-root-patch.yml > /tmp/previous-patch.yml
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/previous-patch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = src[start:end]
          indents = [len(line) - len(line.lstrip()) for line in lines if line.strip()]
          trim = min(indents)
          Path('/tmp/arx-multi-root-core.py').write_text(
              '\n'.join(line[trim:] if line.strip() else '' for line in lines) + '\n'
          )
          PY
          python3 /tmp/arx-multi-root-core.py

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Keep #257 dependency-free: use a unique std::env temp directory in
          # the new library tests rather than introducing a Cargo dependency.
          replace_once(
              'src/transfer/webdav_batch.rs',
              '''    use std::path::PathBuf;\n\n    fn local_file(name: &str) -> ListedEntry {\n''',
              '''    use std::path::PathBuf;\n\n    fn test_temp_dir(label: &str) -> PathBuf {\n        let nanos = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .expect("clock")\n            .as_nanos();\n        let path = std::env::temp_dir().join(format!(\n            "arx-webdav-batch-{label}-{}-{nanos}",\n            std::process::id()\n        ));\n        std::fs::create_dir_all(&path).unwrap();\n        path\n    }\n\n    fn local_file(name: &str) -> ListedEntry {\n''',
          )
          replace_once(
              'src/transfer/webdav_batch.rs',
              '''        let destination = tempfile::tempdir().unwrap();\n        let (spec, names) = prepare_webdav_copy_batch(\n            &dav_location("dav", "/presentation/ignored"),\n            &Location::Local(destination.path().to_path_buf()),\n''',
              '''        let destination = test_temp_dir("download");\n        let (spec, names) = prepare_webdav_copy_batch(\n            &dav_location("dav", "/presentation/ignored"),\n            &Location::Local(destination.clone()),\n''',
          )
          replace_once(
              'src/transfer/webdav_batch.rs',
              '''        let destination = tempfile::tempdir().unwrap();\n        std::fs::write(destination.path().join("a"), b"existing").unwrap();\n        let error = prepare_webdav_copy_batch(\n            &dav_location("dav", "/"),\n            &Location::Local(destination.path().to_path_buf()),\n''',
              '''        let destination = test_temp_dir("collision");\n        std::fs::write(destination.join("a"), b"existing").unwrap();\n        let error = prepare_webdav_copy_batch(\n            &dav_location("dav", "/"),\n            &Location::Local(destination.clone()),\n''',
          )

          # The old characterization test intentionally rejected WebDAV multi-
          # selection. #257 makes that behavior valid, so turn it into a Tokio
          # acceptance proving one multi-root selection creates exactly one job.
          old = '''    #[test]\n    fn webdav_multi_selection_dispatch_fails_before_enqueue() {\n'''
          new = '''    #[tokio::test]\n    async fn webdav_multi_selection_dispatch_queues_one_job() {\n'''
          replace_once('src/tui/transfers.rs', old, new)
          replace_once(
              'src/tui/transfers.rs',
              '''        assert_eq!(\n            state.message.as_deref(),\n            Some("WebDAV copy currently supports one selected item")\n        );\n        assert!(sync.jobs.snapshot().is_empty(), "nothing enqueued");\n''',
              '''        let message = state.message.as_deref().expect("queue confirmation");\n        assert!(message.starts_with("Copy queued ("), "unexpected message: {message}");\n        assert_eq!(sync.jobs.snapshot().len(), 1, "one batch selection = one job");\n''',
          )
          PY

      - name: Standard acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --locked --all-features
          git diff --check

      - name: Commit clean production implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dev-webdav-multi-root-patch.yml
          git rm .github/workflows/dev-webdav-multi-root-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transfer/mod.rs src/transfer/webdav_batch.rs src/transfer/executor.rs src/tui/transfers.rs
          git commit -m 'feat: wire WebDAV multi-root F5 copy'
          git push origin HEAD:feature/webdav-multi-root-copy
