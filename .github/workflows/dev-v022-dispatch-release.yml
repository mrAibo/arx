name: DEV v0.22 dispatch release

on:
  push:
    branches: [release/v0.22.0]
    paths:
      - '.github/workflows/dev-v022-dispatch-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Verify tag and dispatch Release on tag ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='8737bbd2afaf0d6e7146a5d8c59ee1a0606325bf'
          TAG='v0.22.0'
          REMOTE="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$REMOTE" = "$EXPECTED" || { echo "tag target mismatch: $REMOTE != $EXPECTED"; exit 1; }
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mrAibo/arx/actions/workflows/release.yml/dispatches \
            -d '{"ref":"v0.22.0"}'
