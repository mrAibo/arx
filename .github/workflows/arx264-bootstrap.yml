name: ARX264 Integration

on:
  push:
    branches: [feature/s3-object-bucket-inspector]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/s3-object-bucket-inspector
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Wire inspector into product paths
        run: python3 scripts/arx264_integrate.py

      - name: Quality and MSRV gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --locked --all-features
          git diff --check

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/storage_inspector_ui.rs src/tui/feature_registry.rs src/tui.rs .github/workflows/ci.yml
          git commit -m 'feat: integrate S3 inspector with Alt+U and MinIO CI'
          git push origin HEAD:feature/s3-object-bucket-inspector
