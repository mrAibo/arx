        assert!(target_from_context(&location, None).is_err());
        let listed = ListedEntry {
            entry: crate::vfs::Entry {
                name: "display".into(),
                kind: crate::vfs::EntryKind::Directory,
                size: None,
                modified_unix_ms: None,
            },
