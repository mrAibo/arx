name: ARX264 Integration

on:
  push:
    branches: [feature/s3-object-bucket-inspector]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/s3-object-bucket-inspector
          fetch-depth: 0

      - name: Reproduce previously gated source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/arx264_integrate.py')
          text = p.read_text()
          marker = '\nrep(\n    ".github/workflows/ci.yml",'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip('\n') + '\n'
          p.write_text(text)
          PY
          python3 scripts/arx264_integrate.py
          python3 scripts/arx264_fix1.py
          git diff --check -- src/lib.rs src/s3_inspector.rs src/storage_inspector_ui.rs src/tui/feature_registry.rs src/tui.rs src/app/registration.rs src/app/availability.rs

      - name: Commit gated source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/s3_inspector.rs src/storage_inspector_ui.rs src/tui/feature_registry.rs src/tui.rs src/app/registration.rs src/app/availability.rs
          git commit -m 'feat: integrate S3 inspector with Alt+U'
          git push origin HEAD:feature/s3-object-bucket-inspector
