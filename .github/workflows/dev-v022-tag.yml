name: DEV v0.22 tag

on:
  push:
    branches: [release/v0.22.0]
    paths:
      - '.github/workflows/dev-v022-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Create exact lightweight release tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='8737bbd2afaf0d6e7146a5d8c59ee1a0606325bf'
          TAG='v0.22.0'
          git fetch --no-tags origin main
          ACTUAL="$(git rev-parse FETCH_HEAD)"
          test "$ACTUAL" = "$EXPECTED" || { echo "main moved: $ACTUAL != $EXPECTED"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/tmp/tagref 2>/dev/null; then
            echo "tag already exists; refusing to overwrite"
            cat /tmp/tagref
            exit 1
          fi
          git tag "$TAG" "$EXPECTED"
          test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED"
          git push origin "refs/tags/$TAG"
