name: DEV v0.22 lock bump

on:
  push:
    branches: [release/v0.22.0]
    paths:
      - '.github/workflows/dev-v022-lock-bump.yml'

permissions:
  contents: write

jobs:
  bump-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Bump only the root arx lock entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.lock')
          text = p.read_text()
          old = '[[package]]\nname = "arx"\nversion = "0.21.0"\n'
          new = '[[package]]\nname = "arx"\nversion = "0.22.0"\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one root arx 0.21.0 lock entry, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          cargo metadata --locked --no-deps --format-version 1 >/tmp/metadata.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/metadata.json'))
          arx=[p for p in data['packages'] if p['name']=='arx']
          assert len(arx)==1 and arx[0]['version']=='0.22.0', arx
          PY
      - name: Commit Cargo.lock only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m 'release: bump lockfile version to 0.22.0'
          git push origin HEAD:release/v0.22.0
