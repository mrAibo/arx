name: Dispatch v0.25.0 release (temporary)

on:
  push:
    branches:
      - 'release/v0.25.0'
    paths:
      - '.github/workflows/publish-v0.25-tag.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable release identity
        env:
          EXPECTED_SHA: 068d360abed853f1c6b05d8bf7a529c6b8cdfdb5
          TAG: v0.25.0
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Dispatch existing Release workflow on immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.25.0
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="$TAG" \
            -f 'inputs[version]=0.25.0'
