name: Publish v0.25.0 tag (temporary)

on:
  push:
    branches:
      - 'release/v0.25.0'
    paths:
      - '.github/workflows/publish-v0.25-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable release target
        env:
          EXPECTED_SHA: 068d360abed853f1c6b05d8bf7a529c6b8cdfdb5
          TAG: v0.25.0
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to retarget or replace it." >&2
            exit 1
          fi
          git cat-file -e "$EXPECTED_SHA^{commit}"

      - name: Create immutable lightweight tag
        env:
          EXPECTED_SHA: 068d360abed853f1c6b05d8bf7a529c6b8cdfdb5
          TAG: v0.25.0
        run: |
          set -euo pipefail
          git tag "$TAG" "$EXPECTED_SHA"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
