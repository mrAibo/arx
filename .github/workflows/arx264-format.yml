name: ARX264 Canonical Format

on:
  push:
    branches: [feature/s3-object-bucket-inspector]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/s3-object-bucket-inspector
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Canonical rustfmt
        run: |
          set -euo pipefail
          cargo fmt
          cargo fmt --check
          git diff --check

      - name: Commit rustfmt only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/s3_inspector.rs src/s3_inspector_ui.rs src/storage_inspector_ui.rs tests/s3_inspector_minio.rs
          git diff --cached --quiet && { echo 'no rustfmt changes'; exit 0; }
          git commit -m 'style: apply canonical rustfmt to S3 inspector'
          git push origin HEAD:feature/s3-object-bucket-inspector
