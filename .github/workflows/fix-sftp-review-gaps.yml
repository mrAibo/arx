name: Fix SFTP review safety gaps

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Apply exact reviewed safety corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/transfer/sftp_copy.rs')
          s = p.read_text()

          old_connect = '    let source = OpenSshSftpConnection::connect(source_host).await?;\n'
          new_connect = '''    let source = OpenSshSftpConnection::connect(source_host)
        .await
        .map_err(TransferExecutionError::safe_to_retry)?;
'''
          if s.count(old_connect) != 1:
              raise SystemExit(f'expected one source-connect anchor, got {s.count(old_connect)}')
          s = s.replace(old_connect, new_connect)

          old_after = '''    let source_after = source_connection
        .session()
        .symlink_metadata(source_path)
        .await
        .map_err(|error| phase_sftp(name, error, RetryDisposition::SafeToRetry))?;
'''
          new_after = '''    let source_after = match source_connection
        .session()
        .symlink_metadata(source_path)
        .await
    {
        Ok(metadata) => metadata,
        Err(error) => {
            return Err(clean_remote_stage(
                destination_connection,
                &temp,
                phase_sftp(name, error, RetryDisposition::SafeToRetry),
            )
            .await);
        }
    };
'''
          if s.count(old_after) != 1:
              raise SystemExit(f'expected one post-stream metadata anchor, got {s.count(old_after)}')
          s = s.replace(old_after, new_after)
          p.write_text(s)
          PY
          cargo fmt
          CHANGED="$(git diff --name-only)"
          if [ "$CHANGED" != "src/transfer/sftp_copy.rs" ]; then
            echo "::error::unexpected changed files: $CHANGED"
            exit 1
          fi
          git diff --check
          cargo test --locked --lib transfer::sftp_copy::tests::phase_error_preserves_retry_disposition
          cargo clippy --locked --lib -- -D warnings

      - name: Commit corrections and remove helper
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/fix-sftp-review-gaps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/transfer/sftp_copy.rs .github/workflows/fix-sftp-review-gaps.yml
          git commit -m "fix: preserve SFTP precommit retry and cleanup truth"
          git push origin "HEAD:${HEAD_REF}"
