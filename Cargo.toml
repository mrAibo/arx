[package]
name = "arx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal commander for local and remote files, archives, transfers, and jobs"
license = "MIT"
repository = "https://github.com/mrAibo/arx"
documentation = "https://github.com/mrAibo/arx"
readme = "README.md"
keywords = ["tui", "file-manager", "sftp", "rsync", "terminal", "commander"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
