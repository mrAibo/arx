[package]
name = "arx"
version = "0.17.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal commander for local and remote files, archives, transfers, and jobs"
license = "MIT"
repository = "https://github.com/mrAibo/arx"
documentation = "https://github.com/mrAibo/arx"
readme = "README.md"
keywords = ["tui", "file-manager", "sftp", "rsync", "terminal", "commander"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
russh = "0.55"
russh-sftp = "2.1"
async-trait = "0.1"
anyhow = "1"
portable-pty = "0.8"
keyring = "4.1.6"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send"] }
thiserror = "2.0.19"
tempfile = "3"
aws-config = "=1.8.8"
aws-sdk-s3 = "=1.109.0"

[dev-dependencies]
