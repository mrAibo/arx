[package]
name = "arx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal commander for local and remote files, archives, transfers, and jobs"
license = "MIT"
repository = "https://github.com/mrAibo/arx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
